# Extent Spark HTML Report
extent.reporter.spark.start=true
extent.reporter.spark.out=target/extent-report/RestfulBookerReport.html
extent.reporter.spark.config=src/test/resources/spark-config.xml

# Report sections and their order
extent.reporter.spark.vieworder=dashboard,test,category,exception,log

# Attachments
screenshot.dir=target/extent-report/attachments/
screenshot.rel.path=./attachments/
